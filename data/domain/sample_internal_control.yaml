# Sample domain graph for a financial holding company's internal control
# system. Replace with real org/regulation/control data, or use this as a
# template for additional YAML files loaded via scripts/seed_graph.py.

nodes:
  # --- 조직 ---
  - type: Company
    id: co-hq
    name: 한국금융지주
    biz_reg_no: "110-81-00000"

  - type: Department
    id: dept-compliance
    name: 준법감시부
    company_id: co-hq

  - type: Department
    id: dept-risk
    name: 리스크관리부
    company_id: co-hq

  - type: Department
    id: dept-it
    name: IT기획부
    company_id: co-hq

  - type: Person
    id: person-kim
    name: 김민준
    title: 준법감시인
    employee_no: E10234

  - type: Person
    id: person-lee
    name: 이서연
    title: 리스크관리팀장
    employee_no: E10567

  # --- 법규/규정 ---
  - type: Law
    id: law-financial-holding-act
    name: 금융지주회사법
    article: 제24조(내부통제기준)

  - type: Regulation
    id: reg-internal-control-standard
    name: 내부통제기준
    version: "2025.3"
    category: 준법감시
    effective_date: "2025-03-01"

  - type: Regulation
    id: reg-it-security-policy
    name: 정보보안관리규정
    version: "2024.11"
    category: IT보안
    effective_date: "2024-11-01"

  # --- 리스크 ---
  - type: Risk
    id: risk-unauthorized-access
    name: 시스템 무단 접근 리스크
    severity: 상
    category: 운영리스크

  - type: Risk
    id: risk-compliance-violation
    name: 법규 위반 리스크
    severity: 상
    category: 컴플라이언스

  # --- 업무 프로세스 ---
  - type: Process
    id: proc-access-management
    name: 시스템 접근권한 관리 프로세스
    description: 임직원 시스템 계정 발급/변경/회수 프로세스

  - type: Process
    id: proc-compliance-monitoring
    name: 준법감시 모니터링 프로세스
    description: 영업 부서 거래 및 업무의 법규 준수 여부 상시 점검

  # --- 통제항목 ---
  - type: ControlItem
    id: ctrl-access-review
    name: 분기별 접근권한 검토
    control_type: 적발
    frequency: 분기

  - type: ControlItem
    id: ctrl-compliance-checklist
    name: 일일 컴플라이언스 점검표 작성
    control_type: 예방
    frequency: 일간

edges:
  - label: BELONGS_TO
    start: {type: Department, id: dept-compliance}
    end: {type: Company, id: co-hq}

  - label: BELONGS_TO
    start: {type: Department, id: dept-risk}
    end: {type: Company, id: co-hq}

  - label: BELONGS_TO
    start: {type: Department, id: dept-it}
    end: {type: Company, id: co-hq}

  - label: MEMBER_OF
    start: {type: Person, id: person-kim}
    end: {type: Department, id: dept-compliance}

  - label: MEMBER_OF
    start: {type: Person, id: person-lee}
    end: {type: Department, id: dept-risk}

  - label: BASED_ON
    start: {type: Regulation, id: reg-internal-control-standard}
    end: {type: Law, id: law-financial-holding-act}

  - label: OWNS
    start: {type: Department, id: dept-it}
    end: {type: Process, id: proc-access-management}

  - label: OWNS
    start: {type: Department, id: dept-compliance}
    end: {type: Process, id: proc-compliance-monitoring}

  - label: PART_OF
    start: {type: ControlItem, id: ctrl-access-review}
    end: {type: Process, id: proc-access-management}

  - label: PART_OF
    start: {type: ControlItem, id: ctrl-compliance-checklist}
    end: {type: Process, id: proc-compliance-monitoring}

  - label: MITIGATES
    start: {type: ControlItem, id: ctrl-access-review}
    end: {type: Risk, id: risk-unauthorized-access}

  - label: MITIGATES
    start: {type: ControlItem, id: ctrl-compliance-checklist}
    end: {type: Risk, id: risk-compliance-violation}

  - label: IMPLEMENTS
    start: {type: ControlItem, id: ctrl-access-review}
    end: {type: Regulation, id: reg-it-security-policy}

  - label: IMPLEMENTS
    start: {type: ControlItem, id: ctrl-compliance-checklist}
    end: {type: Regulation, id: reg-internal-control-standard}

  - label: RESPONSIBLE_FOR
    start: {type: Person, id: person-kim}
    end: {type: ControlItem, id: ctrl-compliance-checklist}

  - label: RESPONSIBLE_FOR
    start: {type: Person, id: person-lee}
    end: {type: ControlItem, id: ctrl-access-review}

  - label: AFFECTS
    start: {type: Risk, id: risk-unauthorized-access}
    end: {type: Process, id: proc-access-management}

  - label: AFFECTS
    start: {type: Risk, id: risk-compliance-violation}
    end: {type: Process, id: proc-compliance-monitoring}
